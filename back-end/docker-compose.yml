name: ong

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER (copy .env.example to .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB (copy .env.example to .env)}
    ports:
      - "5432:5432"
    volumes:
      - ong_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ONG.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      AdminSeed__Username: ${ADMIN_SEED_USERNAME:?Set ADMIN_SEED_USERNAME (copy .env.example to .env)}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:?Set ADMIN_SEED_PASSWORD (copy .env.example to .env)}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY (copy .env.example to .env) - must be at least 32 characters}
      ClientCredentials__ClientId: ${CLIENT_ID:?Set CLIENT_ID (copy .env.example to .env)}
      ClientCredentials__ClientSecret: ${CLIENT_SECRET:?Set CLIENT_SECRET (copy .env.example to .env) - must be at least 16 characters}
    ports:
      - "5127:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ong_postgres_data:
