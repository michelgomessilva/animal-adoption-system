name: backend-docker

on:
  pull_request:
    paths:
      - "back-end/**"
  push:
    branches:
      - main
    paths:
      - "back-end/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: dotnet build
        run: dotnet build ONG.slnx

      - name: dotnet test
        run: dotnet test ONG.slnx --filter "Category!=Integration"

  docker-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: dotnet restore
        run: dotnet restore ONG.slnx

      - name: Build backend Docker image
        run: docker compose build backend

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Apply EF Core migrations
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=ongdb;Username=ong_user;Password=ong_password"
        run: |
          dotnet tool restore
          dotnet ef database update --project ONG.Infrastructure --startup-project ONG.API

      - name: dotnet test (Postgres-only)
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=ongdb;Username=ong_user;Password=ong_password"
        run: dotnet test ONG.slnx --filter "Category=Integration"

      - name: Smoke test (docker compose up + Swagger check)
        run: |
          docker compose up -d
          echo "Waiting for backend to respond..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5127/swagger/v1/swagger.json > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time."
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
